name: Publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ne publier que le site (pas la base, ni les workflows)
        run: |
          mkdir _site
          cp -r index.html manifest.json service-worker.js icon-192.png icon-512.png src vendor _site/
      - name: Vérifier que tout ce que la page charge est bien publié
        run: |
          missing=0
          for f in $(grep -oE '(src|href)="\./[^"]+"' _site/index.html | sed -E 's/^(src|href)="\.\///; s/"$//'); do
            if [ ! -e "_site/$f" ]; then echo "::error::Fichier manquant dans la publication : $f"; missing=1; fi
          done
          [ "$missing" = 0 ]
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
